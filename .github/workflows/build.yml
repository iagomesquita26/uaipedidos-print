name: Montar instaladores

# Monta o UaiPedidos Print para Windows e Mac.
# Roda ao enviar um commit, ao criar uma tag (ex: v1.0.0) ou pelo botao
# "Run workflow" na aba Actions do GitHub. Nao usa certificado de assinatura.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-latest
            nome: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Gerar os icones
        run: node gen-icons.js

      - name: Montar (Windows)
        if: matrix.nome == 'windows'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar (Mac, sem assinatura)
        if: matrix.nome == 'mac'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: UaiPedidos-Print-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn

  publicar-release:
    # Ao criar uma tag "v...", junta os instaladores num Release do GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os instaladores montados
        uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Criar o Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefatos/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
